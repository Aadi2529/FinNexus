name: finnexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: financeflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finnexus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finnexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: financeflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: financeflow_backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/finnexus_db
      - SYNC_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/finnexus_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://127.0.0.1:5173","http://127.0.0.1:5174","http://127.0.0.1:5175","http://127.0.0.1:5176"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: financeflow_dashboard
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DASHBOARD_URL=http://localhost:5173
      - VITE_CRM_URL=http://localhost:5174
      - VITE_TOOLKIT_URL=http://localhost:5175
      - VITE_INSURANCE_URL=http://localhost:5176
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  crm:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: financeflow_crm
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DASHBOARD_URL=http://localhost:5173
      - VITE_CRM_URL=http://localhost:5174
      - VITE_TOOLKIT_URL=http://localhost:5175
      - VITE_INSURANCE_URL=http://localhost:5176
    ports:
      - "5174:5174"
    volumes:
      - ./crm:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  toolkit:
    build:
      context: ./toolkit
      dockerfile: Dockerfile
    container_name: financeflow_toolkit
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DASHBOARD_URL=http://localhost:5173
      - VITE_CRM_URL=http://localhost:5174
      - VITE_TOOLKIT_URL=http://localhost:5175
      - VITE_INSURANCE_URL=http://localhost:5176
    ports:
      - "5175:5175"
    volumes:
      - ./toolkit:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  insurance-engine:
    build:
      context: ./insurance-engine
      dockerfile: Dockerfile
    container_name: financeflow_insurance
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DASHBOARD_URL=http://localhost:5173
      - VITE_CRM_URL=http://localhost:5174
      - VITE_TOOLKIT_URL=http://localhost:5175
      - VITE_INSURANCE_URL=http://localhost:5176
    ports:
      - "5176:5176"
    volumes:
      - ./insurance-engine:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
